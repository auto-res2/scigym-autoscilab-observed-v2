name: "Verify Record"
run-name: "🔎 Verify the record"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  verify-record:
    name: Verify the record
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify record against run outputs, history and the execution backend
        env:
          SEYVAL_API_KEY: ${{ secrets.SEYVAL_API_KEY }}
          GH_PERSONAL_ACCESS_TOKEN: ${{ github.token }}
        run: |
          # airas の commit SHA は、airas 側の CI（pin_airas_template.yml）によって自動的に書き換えられる。
          uvx --from "airas @ git+https://github.com/airas-org/airas.git@0cda560caf7150fea29c8c42af2a046fbc46f693#subdirectory=backend" \
            airas verify-record --local-path .

      - name: Cross-check paper.pdf against the Publish Paper artifact
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          if ! git rev-parse --verify -q HEAD~1 > /dev/null; then
            changed=$(git show --name-only --format= HEAD)
          else
            changed=$(git diff --name-only HEAD~1 HEAD)
          fi
          pdf_re='^\.research/latex/[^/]+/paper\.pdf$'
          pdfs=$(printf '%s\n' "$changed" | grep -E "$pdf_re" || true)
          if [ -z "$pdfs" ]; then
            echo "HEAD does not change paper.pdf; nothing to cross-check."
            exit 0
          fi

          others=$(printf '%s\n' "$changed" | grep -v -E "$pdf_re" || true)
          if [ -n "$others" ]; then
            fail "a commit that changes paper.pdf may change nothing else; also touches: $(echo "$others" | tr '\n' ' ')"
          fi
          git rev-parse --verify -q HEAD~1 > /dev/null \
            || fail "paper.pdf cannot arrive in a root commit: no Publish Paper run can have built it"
          parent=$(git rev-parse HEAD~1)

          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${parent}&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/publish_paper.yml" and (.conclusion == null or .conclusion == "success")) | .id] | .[]')
          [ -n "$runs" ] || fail "no Publish Paper run built ${parent}; a paper.pdf commit must follow the run that produced it"

          artifact=""
          for run in $runs; do
            artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run}/artifacts" \
              --jq ".artifacts[] | select(.name == \"verified-paper-${parent}\" and .expired == false) | .id" | head -1)
            [ -n "$artifact" ] && break
          done
          [ -n "$artifact" ] || fail "no verified-paper-${parent} artifact on any Publish Paper run for ${parent}"

          tmp=$(mktemp -d)
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact}/zip" > "$tmp/artifact.zip"
          unzip -q "$tmp/artifact.zip" -d "$tmp/artifact"

          for committed in $pdfs; do
            template=$(basename "$(dirname "$committed")")
            built="$tmp/artifact/${template}.pdf"
            [ -f "$built" ] || fail "artifact verified-paper-${parent} holds no ${template}.pdf for ${committed}"
            want=$(sha256sum "$built" | cut -d' ' -f1)
            have=$(sha256sum "$committed" | cut -d' ' -f1)
            if [ "$want" != "$have" ]; then
              fail "${committed} (sha256 ${have}) is not the PDF Publish Paper built from ${parent} (sha256 ${want})"
            fi
            echo "${committed} is byte-identical to artifact verified-paper-${parent} (sha256 ${have})."
          done
